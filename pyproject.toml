[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-clarify"
version = "0.1.0"
description = "Text-to-SQL with a clarification engine: asks instead of guessing."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlglot>=25.0",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.33",
    "faker>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a running Postgres (docker compose up)",
    "llm: needs a live LLM provider",
]

[tool.ruff]
line-length = 100
target-version = "py311"
