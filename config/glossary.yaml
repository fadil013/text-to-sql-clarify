# Business glossary over the `dw` warehouse. If a term is defined here, the system must NOT ask the user
# to clarify it. Terms deliberately ABSENT (so they trigger clarification): "best customer",
# "top customers" (how many?), "recently", "large order", "high value", "loyal", "top product"
# (by what?), "growth" (over which period?).

# short_circuit (optional, per term) lets a question skip the LLM ambiguity check entirely:
#   self_contained  the definition fixes the meaning with no period/threshold needed
#   needs_period    only if the question also names a period (last month, this month, ...)
# Generic nouns (customer, order, region, category) deliberately have none: their presence says
# nothing about whether the rest of the question is clear.
terms:
  revenue:
    short_circuit: needs_period
    definition: >
      Sales revenue = SUM(fact_sales.net_usd_cents) for lines whose order status has is_completed = TRUE
      (paid/shipped/delivered), in USD, after discounts and BEFORE refunds. Cancelled and pending never count.
  net revenue:
    short_circuit: needs_period
    definition: revenue minus SUM(fact_refunds.amount_usd_cents) for the same period.
  gross revenue:
    short_circuit: needs_period
    definition: SUM(fact_sales.gross_cents converted to USD) before discounts for completed orders.
  cash collected:
    short_circuit: needs_period
    definition: SUM(fact_payments.amount_usd_cents) WHERE payment_status = 'succeeded' (by payment date).
  order:
    definition: A distinct order_id in fact_sales. A "completed order" has is_completed = TRUE.
  completed order:
    definition: Order whose dim_order_status.is_completed = TRUE (paid, shipped, delivered).
  customer:
    definition: A dim_customer row with is_test_account = FALSE.
  new customer:
    short_circuit: needs_period
    definition: A customer whose signup date (signup_date_key) falls in the period. Test accounts excluded.
  signed up:
    short_circuit: needs_period
    definition: Same as new customer.
  active customer:
    short_circuit: self_contained
    definition: A customer with at least 1 completed order in the last 90 days.
  paying customer:
    short_circuit: self_contained
    definition: A customer with at least 1 succeeded payment in fact_payments.
  average order value:
    short_circuit: needs_period
    definition: Revenue divided by the number of distinct completed orders, in USD.
  aov:
    short_circuit: needs_period
    definition: Same as average order value.
  discount rate:
    short_circuit: needs_period
    definition: SUM(discount_cents) divided by SUM(gross_cents) over completed orders.
  refund rate:
    short_circuit: needs_period
    definition: Refunded USD cents divided by succeeded payment USD cents.
  mrr:
    short_circuit: needs_period
    definition: SUM(fact_mrr_monthly.mrr_cents) for a month (USD). "Current MRR" = the current month.
  churned subscriber:
    short_circuit: self_contained
    definition: A fact_subscriptions row with subscription_status = 'cancelled'.
  active subscriber:
    short_circuit: self_contained
    definition: A fact_subscriptions row with subscription_status = 'active'.
  category:
    definition: dim_category, reached via dim_product -> dim_subcategory -> dim_category.
  region:
    definition: dim_region, reached via dim_customer -> dim_geography -> dim_region.

time_conventions:
  last month: The previous full calendar month (e.g. on 2026-09-29 that is 2026-08-01 up to but excluding 2026-09-01).
  this month: From the first day of the current calendar month to now.
  last week: The previous full ISO calendar week (Mon-Sun).
  last N days: The N days ending now.
  year to date: From January 1 of the current year to now.
  timezone: UTC.

defaults:
  currency: USD (use *_usd_cents columns unless the user explicitly asks for local currency).
  exclude_test_accounts: true
